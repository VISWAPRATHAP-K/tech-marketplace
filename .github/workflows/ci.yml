name: CI / Build & Typecheck

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client (Backend)
        run: |
          cd apps/api
          npx prisma generate

      - name: Build NestJS API
        run: npm run build:api

      - name: Build Next.js Web Frontend
        run: npm run build:web
